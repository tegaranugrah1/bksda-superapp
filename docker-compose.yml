# =============================================================================
# BKSDA SuperApp — Docker Compose (Local Development)
# =============================================================================
# Hanya PostgreSQL dan pgAdmin untuk development lokal (Sesuai Rule 10.2).
# Backend: php artisan serve
# Frontend: npm run dev
# =============================================================================

version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: bksda-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bksda_superapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bksda-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bksda.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
    driver: local
  pgadmin-data:
    driver: local
