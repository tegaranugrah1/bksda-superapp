# =============================================================================
# BKSDA SuperApp — Docker Compose (Local Development)
# =============================================================================
# PostgreSQL, pgAdmin, dan RustFS untuk development lokal.
# Backend: php artisan serve
# Frontend: npm run dev
# =============================================================================

version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: bksda-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bksda_superapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bksda-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bksda.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

  # ===========================================================================
  # RustFS — S3-compatible Object Storage (pengganti MinIO)
  # Console: http://localhost:9003  |  API: http://localhost:9002
  # ===========================================================================
  rustfs:
    image: rustfs/rustfs:latest
    container_name: bksda-rustfs
    restart: unless-stopped
    command: server /data --address ":9002" --console-address ":9003"
    environment:
      RUSTFS_ROOT_USER: bksda_admin
      RUSTFS_ROOT_PASSWORD: bksda_secret_2025
    ports:
      - "9002:9002"
      - "9003:9003"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9002/minio/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  db-data:
    driver: local
  pgadmin-data:
    driver: local
  rustfs-data:
    driver: local
