services:
  postgres:
    image: postgres:16-alpine
    container_name: hermes-postgres
    restart: always
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=evolution_secret_2026
      - POSTGRES_DB=evolution
    volumes:
      - /opt/hermes/data/postgres:/var/lib/postgresql/data
    networks:
      - hermes-net

  redis:
    image: redis:7.2-alpine
    container_name: hermes-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - /opt/hermes/data/redis:/data
    networks:
      - hermes-net

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: hermes-wa-gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://192.168.100.205:8080
      - DOCKER_ENV=true
      - LOG_LEVEL=ERROR,WARN,INFO
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:?Set a unique gateway API key}
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution_secret_2026@postgres:5432/evolution?schema=public
      - DATABASE_CLIENT_NAME=evolution_exchange
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/1
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=http://hermes-assistant:3000/webhook/evolution
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
    volumes:
      - /opt/hermes/data/evolution_instances:/evolution/instances
      - /opt/hermes/data/evolution_store:/evolution/store
    networks:
      - hermes-net
    depends_on:
      - postgres
      - redis

  hermes-assistant:
    build:
      context: ./assistant
      dockerfile: Dockerfile
    container_name: hermes-assistant-core
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SUPERAPP_API_URL=http://192.168.100.203
      - SUPERAPP_INTERNAL_KEY=${SUPERAPP_INTERNAL_KEY:?Set the matching backend service key}
      - EVOLUTION_API_URL=http://evolution-api:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:?Set a unique gateway API key}
      - EVOLUTION_WEBHOOK_KEY=${EVOLUTION_WEBHOOK_KEY:?Set a separate producer webhook key}
      - ASSISTANT_ADMIN_USERNAME=${ASSISTANT_ADMIN_USERNAME:-admin}
      - ASSISTANT_ADMIN_PASSWORD=${ASSISTANT_ADMIN_PASSWORD:-}
      - EVOLUTION_INSTANCE_NAME=bksda-assistant
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - /opt/hermes/data/logs:/app/logs
    networks:
      - hermes-net
    depends_on:
      - evolution-api
      - redis

networks:
  hermes-net:
    driver: bridge
