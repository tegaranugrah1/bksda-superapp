services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: bksda_superapp
      POSTGRES_USER: bksda_prod
      POSTGRES_PASSWORD: ${DB_PASSWORD:-BksdaProd2026!}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bksda_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:latest
    restart: always
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      RUSTFS_ROOT_USER: ${RUSTFS_USER:-bksda_admin}
      RUSTFS_ROOT_PASSWORD: ${RUSTFS_PASSWORD:-BksdaStorage2026!}
    volumes:
      - rustfs-data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      sh -c "sed -i 's/listen = 127.0.0.1:9000/listen = 0.0.0.0:9000/g' /usr/local/etc/php-fpm.d/www.conf 2>/dev/null || true; php artisan migrate --force && chown -R www-data:www-data /var/www/storage /var/www/bootstrap/cache && exec php-fpm -F"
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_started
    environment:
      APP_NAME: "BKSDA SuperApp"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-https://api.bksdakaltim.web.id}
      FRONTEND_URL: ${FRONTEND_URL:-https://bksdakaltim.web.id}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-bksdakaltim.web.id,www.bksdakaltim.web.id,api.bksdakaltim.web.id,bksdakaltim.net,api.bksdakaltim.net,192.168.100.203,localhost,localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://bksdakaltim.web.id,https://www.bksdakaltim.web.id,http://bksdakaltim.web.id,https://bksdakaltim.net,http://192.168.100.203,http://localhost:3000}
      SESSION_SECURE_COOKIE: "false"
      SESSION_DOMAIN: ${SESSION_DOMAIN:-}
      APP_KEY: ${APP_KEY:-base64:c3wogjv1cxVZ071Pkv2Yorbse2L2KgbA9ix9cxvjE6k=}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: bksda_superapp
      DB_USERNAME: bksda_prod
      DB_PASSWORD: ${DB_PASSWORD:-BksdaProd2026!}
      FILESYSTEM_DISK: s3
      AWS_ACCESS_KEY_ID: ${RUSTFS_USER:-bksda_admin}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_PASSWORD:-BksdaStorage2026!}
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: bksda
      AWS_DRIVE_BUCKET: ${AWS_DRIVE_BUCKET:-bksda-drive}
      AWS_ENDPOINT: http://rustfs:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      AWS_URL: ${AWS_URL:-https://storage.bksdakaltim.web.id/bksda}
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-https://storage.bksdakaltim.web.id}
      SESSION_DRIVER: file
      CACHE_STORE: database
      CACHE_PREFIX: ${CACHE_PREFIX:-bksda-superapp-cache-}
      QUEUE_CONNECTION: database
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-bksda-superapp}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-bksda-reverb-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-bksda-reverb-secret}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      LOG_CHANNEL: stack
      LOG_LEVEL: warning
      BCRYPT_ROUNDS: 12
    volumes:
      - backend-storage:/var/www/storage/app

  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    stop_grace_period: 60s
    command: php artisan queue:work --tries=3 --backoff=10 --max-time=3600 --sleep=3
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
    environment:
      APP_NAME: "BKSDA SuperApp Queue"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-https://api.bksdakaltim.web.id}
      FRONTEND_URL: ${FRONTEND_URL:-https://bksdakaltim.web.id}
      APP_KEY: ${APP_KEY:-base64:c3wogjv1cxVZ071Pkv2Yorbse2L2KgbA9ix9cxvjE6k=}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: bksda_superapp
      DB_USERNAME: bksda_prod
      DB_PASSWORD: ${DB_PASSWORD:-BksdaProd2026!}
      FILESYSTEM_DISK: s3
      AWS_ACCESS_KEY_ID: ${RUSTFS_USER:-bksda_admin}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_PASSWORD:-BksdaStorage2026!}
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: bksda
      AWS_DRIVE_BUCKET: ${AWS_DRIVE_BUCKET:-bksda-drive}
      AWS_ENDPOINT: http://rustfs:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      AWS_URL: ${AWS_URL:-https://storage.bksdakaltim.web.id/bksda}
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-https://storage.bksdakaltim.web.id}
      CACHE_STORE: database
      CACHE_PREFIX: ${CACHE_PREFIX:-bksda-superapp-cache-}
      QUEUE_CONNECTION: database
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-bksda-superapp}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-bksda-reverb-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-bksda-reverb-secret}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      LOG_CHANNEL: stack
      LOG_LEVEL: warning
    volumes:
      - backend-storage:/var/www/storage/app

  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    depends_on:
      backend:
        condition: service_started
    environment:
      APP_NAME: "BKSDA SuperApp Reverb"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:-base64:c3wogjv1cxVZ071Pkv2Yorbse2L2KgbA9ix9cxvjE6k=}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: bksda_superapp
      DB_USERNAME: bksda_prod
      DB_PASSWORD: ${DB_PASSWORD:-BksdaProd2026!}
      CACHE_STORE: database
      CACHE_PREFIX: ${CACHE_PREFIX:-bksda-superapp-cache-}
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-bksda-superapp}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-bksda-reverb-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-bksda-reverb-secret}
      REVERB_HOST: 0.0.0.0
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      LOG_CHANNEL: stack
      LOG_LEVEL: warning

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    command: php artisan schedule:work
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
    environment:
      APP_NAME: "BKSDA SuperApp Scheduler"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-https://api.bksdakaltim.web.id}
      FRONTEND_URL: ${FRONTEND_URL:-https://bksdakaltim.web.id}
      APP_KEY: ${APP_KEY:-base64:c3wogjv1cxVZ071Pkv2Yorbse2L2KgbA9ix9cxvjE6k=}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: bksda_superapp
      DB_USERNAME: bksda_prod
      DB_PASSWORD: ${DB_PASSWORD:-BksdaProd2026!}
      FILESYSTEM_DISK: s3
      AWS_ACCESS_KEY_ID: ${RUSTFS_USER:-bksda_admin}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_PASSWORD:-BksdaStorage2026!}
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: bksda
      AWS_DRIVE_BUCKET: ${AWS_DRIVE_BUCKET:-bksda-drive}
      AWS_ENDPOINT: http://rustfs:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      AWS_URL: ${AWS_URL:-https://storage.bksdakaltim.web.id/bksda}
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-https://storage.bksdakaltim.web.id}
      CACHE_STORE: database
      CACHE_PREFIX: ${CACHE_PREFIX:-bksda-superapp-cache-}
      QUEUE_CONNECTION: database
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-bksda-superapp}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-bksda-reverb-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-bksda-reverb-secret}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      LOG_CHANNEL: stack
      LOG_LEVEL: warning
    volumes:
      - backend-storage:/var/www/storage/app

  nginx-backend:
    image: nginx:alpine
    restart: always
    depends_on:
      - backend
      - reverb
    volumes:
      - ./deploy/nginx-backend.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/public:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.bksdakaltim.web.id/api}
        NEXT_PUBLIC_STORAGE_URL: ${NEXT_PUBLIC_STORAGE_URL:-https://storage.bksdakaltim.web.id/bksda}
        NEXT_PUBLIC_REVERB_APP_KEY: ${NEXT_PUBLIC_REVERB_APP_KEY:-bksda-reverb-key}
    restart: always

volumes:
  db-data:
  rustfs-data:
  backend-storage:
