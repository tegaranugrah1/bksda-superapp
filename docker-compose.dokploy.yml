services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: bksda_superapp
      POSTGRES_USER: bksda_prod
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bksda_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:latest
    restart: always
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      RUSTFS_ROOT_USER: ${RUSTFS_USER:-bksda_admin}
      RUSTFS_ROOT_PASSWORD: ${RUSTFS_PASSWORD:?RUSTFS_PASSWORD is required}
    volumes:
      - rustfs-data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    command: >
      sh -c "php artisan migrate --force && php-fpm"
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_started
    environment:
      APP_NAME: "BKSDA SuperApp"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://api.bksdakaltim.net
      FRONTEND_URL: https://bksdakaltim.net
      SANCTUM_STATEFUL_DOMAINS: bksdakaltim.net,www.bksdakaltim.net,api.bksdakaltim.net,localhost,localhost:3000
      CORS_ALLOWED_ORIGINS: https://bksdakaltim.net,https://www.bksdakaltim.net,http://localhost:3000
      SESSION_SECURE_COOKIE: "true"
      SESSION_DOMAIN: .bksdakaltim.net
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: bksda_superapp
      DB_USERNAME: bksda_prod
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      FILESYSTEM_DISK: s3
      AWS_ACCESS_KEY_ID: ${RUSTFS_USER:-bksda_admin}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_PASSWORD:?RUSTFS_PASSWORD is required}
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: bksda
      AWS_ENDPOINT: http://rustfs:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      AWS_URL: https://storage.bksdakaltim.net/bksda
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stack
      LOG_LEVEL: warning
      BCRYPT_ROUNDS: 12
    volumes:
      - backend-storage:/var/www/storage/app

  nginx-backend:
    image: nginx:alpine
    restart: always
    depends_on:
      - backend
    volumes:
      - ./deploy/nginx-backend.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/public:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.bksdakaltim.net/api
        NEXT_PUBLIC_STORAGE_URL: https://storage.bksdakaltim.net/bksda
    restart: always

volumes:
  db-data:
  rustfs-data:
  backend-storage:
