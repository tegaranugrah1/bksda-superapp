services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: bksda-db
    restart: always
    environment:
      POSTGRES_DB: bksda_superapp
      POSTGRES_USER: bksda_prod
      POSTGRES_PASSWORD: ${DB_PASSWORD:-BksdaProd2026!}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bksda_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RustFS Object Storage
  rustfs:
    image: rustfs/rustfs:latest
    container_name: bksda-rustfs
    restart: always
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      RUSTFS_ROOT_USER: ${RUSTFS_USER:-bksda_admin}
      RUSTFS_ROOT_PASSWORD: ${RUSTFS_PASSWORD:-BksdaStorage2026!}
    volumes:
      - rustfs-data:/data

  # Laravel Backend (PHP-FPM)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bksda-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_started
    environment:
      APP_NAME: "BKSDA SuperApp"
      APP_ENV: production
      APP_DEBUG: "true"
      APP_URL: https://api.bksdakaltim.net
      FRONTEND_URL: https://bksdakaltim.net
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: bksda_superapp
      DB_USERNAME: bksda_prod
      DB_PASSWORD: ${DB_PASSWORD:-BksdaProd2026!}
      FILESYSTEM_DISK: s3
      AWS_ACCESS_KEY_ID: ${RUSTFS_USER:-bksda_admin}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_PASSWORD:-BksdaStorage2026!}
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: bksda
      AWS_ENDPOINT: http://rustfs:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      AWS_URL: https://bksdakaltim.net/storage
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stack
      LOG_LEVEL: warning
      BCRYPT_ROUNDS: 12
    volumes:
      - backend-storage:/var/www/storage/app

  # Nginx for Backend
  nginx-backend:
    image: nginx:alpine
    container_name: bksda-nginx-backend
    restart: always
    depends_on:
      - backend
    volumes:
      - ./deploy/nginx-backend.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/public:ro

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://bksdakaltim.net/api
        NEXT_PUBLIC_STORAGE_URL: https://bksdakaltim.net/storage
    container_name: bksda-frontend
    restart: always

  # Nginx Reverse Proxy (main entry point)
  nginx:
    image: nginx:alpine
    container_name: bksda-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - nginx-backend
      - rustfs
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
      - certbot-data:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro

  # Certbot for SSL
  certbot:
    image: certbot/certbot
    container_name: bksda-certbot
    volumes:
      - certbot-data:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  db-data:
  rustfs-data:
  backend-storage:
  certbot-data:
  certbot-certs:
